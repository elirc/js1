<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker CRUD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="summary">
      <div>
        <p class="eyebrow">Project 5</p>
        <h1>Budget Tracker</h1>
      </div>
      <div class="totals" aria-live="polite">
        <span>Income <strong id="income-total">$0.00</strong></span>
        <span>Expenses <strong id="expense-total">$0.00</strong></span>
        <span>Balance <strong id="balance-total">$0.00</strong></span>
      </div>
    </section>

    <section class="grid">
      <form id="transaction-form" class="panel" aria-label="Transaction form">
        <input type="hidden" id="transaction-id">

        <label for="description">Description</label>
        <input id="description" type="text" maxlength="80" placeholder="Freelance invoice" required>

        <label for="category">Category</label>
        <input id="category" type="text" maxlength="40" placeholder="Income" required>

        <div class="field-row">
          <div>
            <label for="type">Type</label>
            <select id="type">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div>
            <label for="amount">Amount</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="125.00" required>
          </div>
        </div>

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <div class="actions">
          <button id="save-button" type="submit">Add transaction</button>
          <button id="cancel-button" class="secondary" type="button" hidden>Cancel</button>
        </div>
        <p id="message" class="message" role="status"></p>
      </form>

      <section class="panel">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search transactions">
          <select id="type-filter">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div id="transactions" class="transactions" aria-live="polite"></div>
        <p id="empty" class="empty" hidden>No transactions found.</p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
